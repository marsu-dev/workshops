    <style>
        /* Critical CSS to prevent FOUC - hide content until Reveal.js is ready */
        body {
            background-color: #0d1117 !important;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 100px 100px;
        }

        html:not(.reveal-ready) body {
            overflow: hidden;
        }

        html:not(.reveal-ready) .reveal {
            visibility: hidden;
            opacity: 0;
        }

        html:not(.reveal-ready) .controls-container,
        html:not(.reveal-ready) .cc-watermark {
            opacity: 0;
        }

        html.reveal-ready .reveal {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.3s ease-in;
        }

        html.reveal-ready .controls-container,
        html.reveal-ready .cc-watermark {
            opacity: 1;
            transition: opacity 0.3s ease-in;
        }

        /* Loading state */
        .reveal-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #f7931a;
            font-family: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 1.5em;
        }

        html.reveal-ready .reveal-loading {
            display: none;
        }

        .reveal-loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%,
            100% {
                content: '...';
            }
        }

        /* Bitcoin Orange Theme - Adjustments to the Night theme */

            background-size: 100px 100px;

    <script>
        // Language Management System
        const LanguageManager = {
            STORAGE_KEY: 'workshop-language',
            SUPPORTED_LANGUAGES: ['fr', 'en', 'es', 'it', 'de'],
            DEFAULT_LANGUAGE: 'fr',

            detectBrowserLanguage() {
                const browserLang = navigator.language || navigator.userLanguage;
                const langCode = browserLang.split('-')[0].toLowerCase();
                return this.SUPPORTED_LANGUAGES.includes(langCode) ? langCode : this.DEFAULT_LANGUAGE;
            },

            getLanguage() {
                const stored = localStorage.getItem(this.STORAGE_KEY);
                if (stored && this.SUPPORTED_LANGUAGES.includes(stored)) {
                    return stored;
                }
                return this.detectBrowserLanguage();
            },

            setLanguage(lang) {
                if (this.SUPPORTED_LANGUAGES.includes(lang)) {
                    localStorage.setItem(this.STORAGE_KEY, lang);
                    return true;
                }
                return false;
            },

            initLanguageSelector() {
                const currentLang = this.getLanguage();
                const select = document.getElementById('language-select-presentation');
                if (select) {
                    select.value = currentLang;
                    select.addEventListener('change', (e) => {
                        const lang = e.target.value;
                        if (this.setLanguage(lang)) {
                            // Extract base file path and reload with new language
                            const urlParams = new URLSearchParams(window.location.search);
                            const filePath = urlParams.get('file');
                            if (filePath) {
                                // Remove language suffix if present
                                const basePath = filePath.replace(/\.(fr|en|es|it|de)\.md$/, '');
                                const newPath = `${basePath}.${lang}.md`;
                                window.location.href = `presentation.html?file=${encodeURIComponent(newPath)}&lang=${lang}`;
                            } else {
                                location.reload();
                            }
                        }
                    });
                }
            }
        };

        // Function to mark page as ready and hide loading state
        function markRevealReady() {
            document.documentElement.classList.add('reveal-ready');
        }

        // Get the file from the URL
        const urlParams = new URLSearchParams(window.location.search);
        let filePath = urlParams.get('file');
        const langParam = urlParams.get('lang');

        // Get current language (from URL param, localStorage, or browser)
        const currentLang = langParam || LanguageManager.getLanguage();
        if (langParam) {
            LanguageManager.setLanguage(langParam);
        }
        document.documentElement.lang = currentLang;

        // Initialize language selector
        LanguageManager.initLanguageSelector();

        // If filePath doesn't have language suffix, add it
        if (filePath && !filePath.match(/\.(fr|en|es|it|de)\.md$/)) {
            // Extract base path and add language suffix
            const basePath = filePath.replace(/\.md$/, '');
            filePath = `${basePath}.${currentLang}.md`;
        }

        // Key for localStorage based on the file
        const storageKey = filePath ? `reveal-slide-${filePath}` : 'reveal-slide-default';

        // Create the BIP-21 logo on the right (always present, except for Soroban, Git, Liana, Umbrel, Satochip, and hardware-wallets-sparrow)
        if (!filePath || (!filePath.includes('10-presentation-soroban') && !filePath.includes('05-git-basics') && !filePath.includes('06-git-advanced') && !filePath.includes('07-liana-basics') && !filePath.includes('08-liana-advanced') && !filePath.includes('09-installer-umbrel') && !filePath.includes('11-satochip') && !filePath.includes('12-hardware-wallets-sparrow'))) {
            const logoBip21 = document.createElement('a');
            logoBip21.href = 'https://bip-21.fr/';
            logoBip21.target = '_blank';
            logoBip21.rel = 'noopener noreferrer';
            logoBip21.className = 'logo-bip-21-container';
            logoBip21.title = 'BIP-21 - Bitcoin Île-de-France Partenaires';
            document.body.appendChild(logoBip21);
        }

        // Change the logo according to the presentation
        if (filePath && filePath.includes('be-bop')) {
            document.querySelector('.reveal').classList.add('logo-be-bop');
            // Create the link for the be-bop logo
            const logoContainer = document.createElement('a');
            logoContainer.href = 'https://be-bop.io/';
            logoContainer.target = '_blank';
            logoContainer.rel = 'noopener noreferrer';
            logoContainer.className = 'logo-be-bop-container';
            logoContainer.title = 'be-BOP';
            const logoImg = document.createElement('img');
            logoImg.src = 'themes/logo-be-bop.svg';
            logoImg.alt = 'be-BOP';
            logoContainer.appendChild(logoImg);
            document.body.appendChild(logoContainer);
        } else if (filePath && filePath.includes('sparrow') && !filePath.includes('multisig')) {
            // Add the Sparrow logo on the left for Sparrow presentations (but not for multisig which uses BIP-21)
            const logoContainer = document.createElement('a');
            logoContainer.href = 'https://www.sparrowwallet.com/';
            logoContainer.target = '_blank';
            logoContainer.rel = 'noopener noreferrer';
            logoContainer.className = 'logo-sparrow-container';
            logoContainer.title = 'Sparrow Wallet';
            document.body.appendChild(logoContainer);
        } else if (filePath && filePath.includes('12-hardware-wallets-sparrow')) {
            // Add the Sparrow logo on the left for hardware wallets with Sparrow presentations
            const logoSparrow = document.createElement('a');
            logoSparrow.href = 'https://www.sparrowwallet.com/';
            logoSparrow.target = '_blank';
            logoSparrow.rel = 'noopener noreferrer';
            logoSparrow.className = 'logo-sparrow-container';
            logoSparrow.title = 'Sparrow Wallet';
            document.body.appendChild(logoSparrow);

            // Add the Marsu-dev logo on the right for hardware wallets with Sparrow presentations (primary logo, replaces BIP-21)
            const logoMarsu = document.createElement('a');
            logoMarsu.href = 'https://github.com/marsu-dev';
            logoMarsu.target = '_blank';
            logoMarsu.rel = 'noopener noreferrer';
            logoMarsu.className = 'logo-marsu-dev-container';
            logoMarsu.title = 'Marsu Dev';
            document.body.appendChild(logoMarsu);
        } else if (filePath && (filePath.includes('05-git-basics') || filePath.includes('06-git-advanced'))) {
            // Add the Git logo (GitHub icon) on the left for Git presentations (secondary logo)
            const logoGit = document.createElement('a');
            logoGit.href = 'https://git-scm.com/';
            logoGit.target = '_blank';
            logoGit.rel = 'noopener noreferrer';
            logoGit.className = 'logo-git-container';
            logoGit.title = 'Git';
            const icon = document.createElement('i');
            icon.className = 'fab fa-github';
            logoGit.appendChild(icon);
            document.body.appendChild(logoGit);

            // Add the Marsu-dev logo on the right for Git presentations (primary logo, replaces BIP-21)
            const logoMarsu = document.createElement('a');
            logoMarsu.href = 'https://github.com/marsu-dev';
            logoMarsu.target = '_blank';
            logoMarsu.rel = 'noopener noreferrer';
            logoMarsu.className = 'logo-marsu-dev-container';
            logoMarsu.title = 'Marsu Dev';
            document.body.appendChild(logoMarsu);
        } else if (filePath && (filePath.includes('07-liana-basics') || filePath.includes('08-liana-advanced'))) {
            // Add the Liana logo on the left for Liana presentations
            const logoLiana = document.createElement('a');
            logoLiana.href = 'https://wizardsardine.com/liana/';
            logoLiana.target = '_blank';
            logoLiana.rel = 'noopener noreferrer';
            logoLiana.className = 'logo-liana-container';
            logoLiana.title = 'Liana';
            document.body.appendChild(logoLiana);

            // Add the Marsu-dev logo on the right for Liana presentations (primary logo, replaces BIP-21)
            const logoMarsu = document.createElement('a');
            logoMarsu.href = 'https://github.com/marsu-dev';
            logoMarsu.target = '_blank';
            logoMarsu.rel = 'noopener noreferrer';
            logoMarsu.className = 'logo-marsu-dev-container';
            logoMarsu.title = 'Marsu Dev';
            document.body.appendChild(logoMarsu);
        } else if (filePath && filePath.includes('09-installer-umbrel')) {
            // Add the Umbrel logo on the left for Umbrel presentations
            const logoUmbrel = document.createElement('a');
            logoUmbrel.href = 'https://umbrel.com/umbrelos';
            logoUmbrel.target = '_blank';
            logoUmbrel.rel = 'noopener noreferrer';
            logoUmbrel.className = 'logo-umbrel-container';
            logoUmbrel.title = 'Umbrel';
            document.body.appendChild(logoUmbrel);

            // Add the Marsu-dev logo on the right for Umbrel presentations (primary logo, replaces BIP-21)
            const logoMarsu = document.createElement('a');
            logoMarsu.href = 'https://github.com/marsu-dev';
            logoMarsu.target = '_blank';
            logoMarsu.rel = 'noopener noreferrer';
            logoMarsu.className = 'logo-marsu-dev-container';
            logoMarsu.title = 'Marsu Dev';
            document.body.appendChild(logoMarsu);
        } else if (filePath && filePath.includes('10-presentation-soroban')) {
            // Add the Soroban logo (Tsuba) on the left for Soroban presentations
            const logoSoroban = document.createElement('a');
            logoSoroban.href = 'https://medium.com/samourai-wallet/wallet-update-0-99-96-introducing-soroban-adc9a36a7ddb';
            logoSoroban.target = '_blank';
            logoSoroban.rel = 'noopener noreferrer';
            logoSoroban.className = 'logo-soroban-container';
            logoSoroban.title = 'Soroban';
            document.body.appendChild(logoSoroban);

            // Add the Meetup Marseille logo on the right for Soroban presentations (replaces BIP-21)
            const logoMeetup = document.createElement('a');
            logoMeetup.href = 'https://marseillebitcoin.org/';
            logoMeetup.target = '_blank';
            logoMeetup.rel = 'noopener noreferrer';
            logoMeetup.className = 'logo-meetup-marseille-container';
            logoMeetup.title = 'Marseille Bitcoin';
            document.body.appendChild(logoMeetup);
        } else if (filePath && filePath.includes('11-satochip')) {
            // Add the Satochip logo (Satoship) on the left for Satochip presentations
            const logoSatochip = document.createElement('a');
            logoSatochip.href = 'https://satochip.io/';
            logoSatochip.target = '_blank';
            logoSatochip.rel = 'noopener noreferrer';
            logoSatochip.className = 'logo-satochip-container';
            logoSatochip.title = 'Satochip';
            document.body.appendChild(logoSatochip);

            // Add the Marsu-dev logo on the right for Satochip presentations (primary logo, replaces BIP-21)
            const logoMarsu = document.createElement('a');
            logoMarsu.href = 'https://github.com/marsu-dev';
            logoMarsu.target = '_blank';
            logoMarsu.rel = 'noopener noreferrer';
            logoMarsu.className = 'logo-marsu-dev-container';
            logoMarsu.title = 'Marsu Dev';
            document.body.appendChild(logoMarsu);
        }

        // Fullscreen mode management
        const fullscreenButton = document.getElementById('fullscreen-button');

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error('Error activating fullscreen mode:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function updateFullscreenButton() {
            const icon = document.getElementById('fullscreen-icon');
            if (document.fullscreenElement) {
                icon.className = 'fa-solid fa-compress';
            } else {
                icon.className = 'fa-solid fa-expand';
            }
        }

        fullscreenButton.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', updateFullscreenButton);

        if (!filePath) {
            document.getElementById('slides-container').innerHTML = `
                <section>
                    <h1>Erreur</h1>
                    <p>Aucun fichier de présentation spécifié.</p>
                    <p><a href="index.html">Retour à l'accueil</a></p>
                </section>
            `;
            Reveal.initialize({
                hash: true,
                controls: true,
                progress: true,
                center: false,
                touch: true,
                loop: false,
                transition: 'slide',
                width: '100%',
                height: '100%'
            }).then(() => {
                markRevealReady();

                // Function to update the slide number
                function updateSlideNumber() {
                    const currentSlide = Reveal.getIndices();
                    const totalSlides = Reveal.getTotalSlides();
                    const slideNumber = currentSlide.h + 1;
                    document.getElementById('slide-number').textContent = `${slideNumber} / ${totalSlides}`;

                    // Save the index in localStorage
                    localStorage.setItem(storageKey, currentSlide.h.toString());
                }

                // Restore the saved position
                const savedSlideIndex = localStorage.getItem(storageKey);
                const slideToLoad = savedSlideIndex ? parseInt(savedSlideIndex, 10) : 0;

                updateSlideNumber();
                Reveal.on('slidechanged', updateSlideNumber);

                // Go to the saved slide or to the first one
                Reveal.slide(slideToLoad);
            });
        } else {
            // Load the markdown file first with fallback to French
            function loadMarkdownFile(path) {
                return fetch(path)
                    .then(response => {
                        if (response.ok) {
                            return response.text();
                        }
                        throw new Error('File not found');
                    });
            }

            // Try to load the file with current language, fallback to French if not found
            loadMarkdownFile(filePath)
                .catch(() => {
                    // Fallback to French if current language file doesn't exist
                    const basePath = filePath.replace(/\.(fr|en|es|it|de)\.md$/, '');
                    const fallbackPath = `${basePath}.fr.md`;
                    if (fallbackPath !== filePath) {
                        filePath = fallbackPath;
                        return loadMarkdownFile(fallbackPath);
                    }
                    throw new Error('Fichier non trouvé');
                })
                .then(markdown => {
                    if (!markdown) {
                        throw new Error('Fichier vide');
                    }
                    return markdown;
                })
                .then(markdown => {
                    // Extract the presentation title (first H1)
                    const titleMatch = markdown.match(/^#\s+(.+)$/m);
                    const presentationTitle = titleMatch ? titleMatch[1] : '';

                    // Display the title at the top of slides
                    if (presentationTitle) {
                        const titleElement = document.createElement('div');
                        titleElement.className = 'presentation-title';
                        titleElement.textContent = presentationTitle;
                        document.body.appendChild(titleElement);
                    }

                    // Convert markdown to Reveal.js slides
                    // Slide separators are --- or ***
                    const slides = markdown.split(/\n---\n|\n\*\*\*\n/);
                    const slidesHTML = slides.map(slide => {
                        const trimmed = slide.trim();
                        if (!trimmed) return '';
                        // Convert markdown to HTML with marked.js
                        const html = marked.parse(trimmed);
                        return `<section>${html}</section>`;
                    }).filter(s => s).join('\n');

                    document.getElementById('slides-container').innerHTML = slidesHTML;

                    // Initialize Reveal.js after loading the content
                    Reveal.initialize({
                        hash: true,
                        controls: true,
                        progress: true,
                        center: false,
                        touch: true,
                        loop: false,
                        transition: 'slide',
                        width: '100%',
                        height: '100%',
                        plugins: [RevealNotes, RevealHighlight]
                    }).then(() => {
                        markRevealReady();

                        // Enable syntax highlighting
                        if (typeof hljs !== 'undefined') {
                            document.querySelectorAll('pre code').forEach((block) => {
                                hljs.highlightElement(block);
                            });
                        }

                        // Function to update the slide number
                        function updateSlideNumber() {
                            const currentSlide = Reveal.getIndices();
                            const totalSlides = Reveal.getTotalSlides();
                            const slideNumber = currentSlide.h + 1; // h is the horizontal index (main slide)
                            document.getElementById('slide-number').textContent = `${slideNumber} / ${totalSlides}`;

                            // Save the index in localStorage
                            localStorage.setItem(storageKey, currentSlide.h.toString());
                        }

                        // Restore the saved position
                        const savedSlideIndex = localStorage.getItem(storageKey);
                        const slideToLoad = savedSlideIndex ? parseInt(savedSlideIndex, 10) : 0;

                        // Update on load
                        updateSlideNumber();

                        // Update on slide change
                        Reveal.on('slidechanged', updateSlideNumber);

                        // Go to the saved slide or to the first one
                        Reveal.slide(slideToLoad);
                    });
                })
                .catch(error => {
                    document.getElementById('slides-container').innerHTML = `
                        <section>
                            <h1>Erreur</h1>
                            <p>Impossible de charger le fichier: ${filePath}</p>
                            <p>${error.message}</p>
                            <p><a href="index.html">Retour à l'accueil</a></p>
                        </section>
                    `;
                    Reveal.initialize({
                        hash: true,
                        controls: true,
                        progress: true,
                        center: true,
                        touch: true,
                        loop: false,
                        transition: 'slide',
                        width: '100%',
                        height: '100%'
                    }).then(() => {
                        markRevealReady();
                    });
                });
        }
    </script>
</body>

</html>
