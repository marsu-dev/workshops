<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="bitcoin-network" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Bitcoin network nodes -->
      <circle cx="50" cy="50" r="3" fill="#f7931a" opacity="0.3"/>
      <circle cx="150" cy="50" r="3" fill="#f7931a" opacity="0.3"/>
      <circle cx="50" cy="150" r="3" fill="#f7931a" opacity="0.3"/>
      <circle cx="150" cy="150" r="3" fill="#f7931a" opacity="0.3"/>
      <circle cx="100" cy="100" r="4" fill="#f7931a" opacity="0.4"/>
      
      <!-- Connection lines -->
      <line x1="50" y1="50" x2="100" y2="100" stroke="#f7931a" stroke-width="0.5" opacity="0.2"/>
      <line x1="150" y1="50" x2="100" y2="100" stroke="#f7931a" stroke-width="0.5" opacity="0.2"/>
      <line x1="50" y1="150" x2="100" y2="100" stroke="#f7931a" stroke-width="0.5" opacity="0.2"/>
      <line x1="150" y1="150" x2="100" y2="100" stroke="#f7931a" stroke-width="0.5" opacity="0.2"/>
      <line x1="50" y1="50" x2="150" y2="50" stroke="#f7931a" stroke-width="0.5" opacity="0.15"/>
      <line x1="50" y1="150" x2="150" y2="150" stroke="#f7931a" stroke-width="0.5" opacity="0.15"/>
      <line x1="50" y1="50" x2="50" y2="150" stroke="#f7931a" stroke-width="0.5" opacity="0.15"/>
      <line x1="150" y1="50" x2="150" y2="150" stroke="#f7931a" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bitcoin-network)"/>
</svg>

