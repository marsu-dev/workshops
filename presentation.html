<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Présentation - Reveal.js</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/theme/night.css" id="theme">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/highlight/monokai.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Thème Bitcoin Orange - Ajustements du thème Night */
        .reveal {
            --r-background-color: #191919;
            --r-main-font: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            --r-main-font-size: 27px;
            --r-main-color: #e8e8e8;
            --r-block-margin: 20px;
            --r-heading-margin: 0 0 20px 0;
            --r-heading-font: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            --r-heading-color: #f7931a;
            --r-heading-line-height: 1.2;
            --r-heading-letter-spacing: normal;
            --r-heading-text-transform: none;
            --r-heading-text-shadow: 0 0 10px rgba(247, 147, 26, 0.35);
            --r-heading-font-weight: bold;
            --r-heading1-text-shadow: 0 0 10px rgba(247, 147, 26, 0.35);
            --r-heading1-size: 2.5em;
            --r-heading2-size: 2.5em;
            --r-heading3-size: 2em;
            --r-heading4-size: 1.6em;
            --r-code-font: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            --r-link-color: #01BFFF;
            --r-link-color-hover: #ffb347;
            --r-selection-background-color: #f7931a;
            --r-selection-color: #191919;
        }

        .reveal .controls {
            color: #f7931a;
        }

        .reveal .progress {
            background: rgba(0, 0, 0, 0.2);
            color: #f7931a;
        }

        .reveal h1 {
            color: #ffb347;
            text-shadow: 0 0 10px rgba(255, 179, 71, 0.35);
        }

        .reveal h2 {
            color: #d67a0a;
            text-shadow: 0 0 10px rgba(214, 122, 10, 0.35);
        }

        .reveal h3,
        .reveal h4,
        .reveal h5,
        .reveal h6 {
            color: #f7931a;
            text-shadow: 0 0 10px rgba(247, 147, 26, 0.35);
        }

        /* Date sur la première slide */
        .reveal section:first-of-type h1+p {
            color: rgba(217, 224, 231, 0.5);
            font-family: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
        }

        .reveal a {
            color: #01BFFF;
        }

        .reveal a:hover {
            color: #ffb347;
        }

        .reveal code {
            background: #2a2a2a;
            color: #ffb347;
        }

        .reveal pre {
            background: #2a2a2a;
            color: #ffb347;
        }

        .reveal ::selection {
            background-color: #f7931a;
            color: #191919;
        }

        .reveal ::-moz-selection {
            background-color: #f7931a;
            color: #191919;
        }

        .reveal blockquote {
            border-left: 4px solid #f7931a;
            background: rgba(247, 147, 26, 0.1);
        }

        .reveal table th {
            background: rgba(247, 147, 26, 0.2);
            color: #f7931a;
        }

        .reveal strong {
            color: #f7931a;
        }

        /* Grille de fond identique à la page d'accueil */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 100px 100px;
            z-index: -1;
            pointer-events: none;
        }

        /* Titre de la présentation en haut des slides */
        .presentation-title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85em;
            letter-spacing: 0.1em;
            pointer-events: none;
            z-index: 99;
            color: rgba(247, 147, 26, 0.6);
            font-family: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 0.5em;
        }

        .presentation-title .separator {
            color: rgba(247, 147, 26, 0.6);
        }

        /* Filigrane Creative Commons sur les slides */
        .cc-watermark {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.95em;
            letter-spacing: 0.1em;
            pointer-events: none;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5em;
            padding: 8px 16px;
        }

        .cc-watermark img {
            height: 1.4em;
            width: auto;
            opacity: 0.6;
            filter: brightness(0) saturate(100%) invert(60%) sepia(95%) saturate(2000%) hue-rotate(0deg) brightness(1) contrast(1.1);
        }

        .cc-watermark span {
            color: rgba(247, 147, 26, 0.6);
            font-family: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }

        .cc-watermark .separator {
            color: rgba(247, 147, 26, 0.6);
            margin: 0 0.5em;
        }

        .controls-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .language-select-presentation {
            background: rgba(247, 147, 26, 0.8);
            color: white;
            border: 1px solid rgba(247, 147, 26, 0.3);
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            transition: background 0.3s;
            text-transform: uppercase;
            outline: none;
            box-sizing: border-box;
            height: 40px;
        }

        .language-select-presentation:hover {
            background: rgba(247, 147, 26, 1);
            border-color: rgba(247, 147, 26, 0.5);
        }

        .language-select-presentation:focus {
            border-color: rgba(247, 147, 26, 0.5);
        }

        .language-select-presentation option {
            background: #0d1117;
            color: #d9e0e7;
        }

        .back-button {
            background: rgba(247, 147, 26, 0.8);
            color: white;
            padding: 10px;
            width: 40px;
            height: 40px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 18px;
            transition: background 0.3s;
            border: 1px solid rgba(247, 147, 26, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .back-button i {
            font-size: 18px;
        }

        .back-button:hover {
            background: rgba(247, 147, 26, 1);
            border-color: rgba(247, 147, 26, 0.5);
        }

        .fullscreen-button {
            background: rgba(247, 147, 26, 0.8);
            color: white;
            padding: 10px;
            width: 40px;
            height: 40px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 18px;
            transition: background 0.3s;
            border: 1px solid rgba(247, 147, 26, 0.3);
            cursor: pointer;
            font-family: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .fullscreen-button i {
            font-size: 18px;
        }

        .fullscreen-button:hover {
            background: rgba(247, 147, 26, 1);
            border-color: rgba(247, 147, 26, 0.5);
        }

        .first-slide-button {
            background: rgba(247, 147, 26, 0.8);
            color: white;
            padding: 10px;
            width: 40px;
            height: 40px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 18px;
            transition: background 0.3s;
            border: 1px solid rgba(247, 147, 26, 0.3);
            cursor: pointer;
            font-family: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .first-slide-button i {
            font-size: 18px;
        }

        .first-slide-button:hover {
            background: rgba(247, 147, 26, 1);
            border-color: rgba(247, 147, 26, 0.5);
        }

        /* Logo BIP-21 en haut à droite sur les slides */
        .logo-bip-21-container {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 70px;
            height: 70px;
            padding: 0.5em;
            background-image: url("themes/logo-bip-21.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 100;
            opacity: 0.8;
            text-decoration: none;
            border: none;
            outline: none;
            display: block;
            transition: opacity 0.3s;
        }

        .logo-bip-21-container:hover {
            opacity: 1;
        }

        .logo-bip-21-container:focus-visible {
            outline: 2px solid rgba(247, 147, 26, 0.6);
            outline-offset: 2px;
        }

        /* Logo be-BOP en haut à gauche pour la présentation be-bop */
        .logo-be-bop-container {
            position: fixed;
            top: 10px;
            left: 20px;
            width: 200px;
            height: 80px;
            padding: 1em 1.2em;
            background-color: rgba(0, 50, 100, 0.6);
            border-radius: 12px;
            border: none;
            outline: none;
            z-index: 100;
            opacity: 0.8;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .logo-be-bop-container:hover {
            opacity: 1;
        }

        .logo-be-bop-container:focus-visible {
            outline: 2px solid rgba(0, 100, 200, 0.6);
            outline-offset: 2px;
        }

        .logo-be-bop-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Logo Sparrow en haut à gauche pour les présentations Sparrow */
        .logo-sparrow-container {
            position: fixed;
            top: 10px;
            left: 20px;
            width: 70px;
            height: 70px;
            padding: 0.5em;
            background-image: url("themes/logo-sparrow.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 100;
            opacity: 0.8;
            text-decoration: none;
            border: none;
            outline: none;
            display: block;
            transition: opacity 0.3s;
        }

        .logo-sparrow-container:hover {
            opacity: 1;
        }

        .logo-sparrow-container:focus-visible {
            outline: 2px solid rgba(247, 147, 26, 0.6);
            outline-offset: 2px;
        }

        /* Indicateur de slide */
        .slide-number {
            background: rgba(247, 147, 26, 0.8);
            color: white;
            padding: 10px 12px;
            min-width: 40px;
            width: auto;
            height: 40px;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'Courier New', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            border: 1px solid rgba(247, 147, 26, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            text-align: center;
            line-height: 1.2;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="controls-container">
        <a href="index.html" class="back-button" title="Accueil"><i class="fa-solid fa-house"></i></a>
        <button class="first-slide-button" id="first-slide-button" title="Première slide"><i
                class="fa-solid fa-backward-step"></i></button>
        <div class="slide-number" id="slide-number">1 / 1</div>
        <select class="language-select-presentation" id="language-select-presentation">
            <option value="fr">FR</option>
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="it">IT</option>
            <option value="de">DE</option>
        </select>
        <button class="fullscreen-button" id="fullscreen-button" title="Plein écran"><i class="fa-solid fa-expand"
                id="fullscreen-icon"></i></button>
    </div>
    <div class="cc-watermark">
        <img src="themes/CC-logo.svg" alt="Creative Commons">
        <span class="separator">|</span>
        <span>@marsu-dev</span>
    </div>

    <div class="reveal">
        <div class="slides" id="slides-container">
            <section>
                <h1>Chargement...</h1>
                <p>Chargement de la présentation...</p>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>

    <script>
        // Language Management System
        const LanguageManager = {
            STORAGE_KEY: 'workshop-language',
            SUPPORTED_LANGUAGES: ['fr', 'en', 'es', 'it', 'de'],
            DEFAULT_LANGUAGE: 'fr',

            detectBrowserLanguage() {
                const browserLang = navigator.language || navigator.userLanguage;
                const langCode = browserLang.split('-')[0].toLowerCase();
                return this.SUPPORTED_LANGUAGES.includes(langCode) ? langCode : this.DEFAULT_LANGUAGE;
            },

            getLanguage() {
                const stored = localStorage.getItem(this.STORAGE_KEY);
                if (stored && this.SUPPORTED_LANGUAGES.includes(stored)) {
                    return stored;
                }
                return this.detectBrowserLanguage();
            },

            setLanguage(lang) {
                if (this.SUPPORTED_LANGUAGES.includes(lang)) {
                    localStorage.setItem(this.STORAGE_KEY, lang);
                    return true;
                }
                return false;
            },

            initLanguageSelector() {
                const currentLang = this.getLanguage();
                const select = document.getElementById('language-select-presentation');
                if (select) {
                    select.value = currentLang;
                    select.addEventListener('change', (e) => {
                        const lang = e.target.value;
                        if (this.setLanguage(lang)) {
                            // Extract base file path and reload with new language
                            const urlParams = new URLSearchParams(window.location.search);
                            const filePath = urlParams.get('file');
                            if (filePath) {
                                // Remove language suffix if present
                                const basePath = filePath.replace(/\.(fr|en|es|it|de)\.md$/, '');
                                const newPath = `${basePath}.${lang}.md`;
                                window.location.href = `presentation.html?file=${encodeURIComponent(newPath)}&lang=${lang}`;
                            } else {
                                location.reload();
                            }
                        }
                    });
                }
            }
        };

        // Récupérer le fichier depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        let filePath = urlParams.get('file');
        const langParam = urlParams.get('lang');

        // Get current language (from URL param, localStorage, or browser)
        const currentLang = langParam || LanguageManager.getLanguage();
        if (langParam) {
            LanguageManager.setLanguage(langParam);
        }
        document.documentElement.lang = currentLang;

        // Initialize language selector
        LanguageManager.initLanguageSelector();

        // If filePath doesn't have language suffix, add it
        if (filePath && !filePath.match(/\.(fr|en|es|it|de)\.md$/)) {
            // Extract base path and add language suffix
            const basePath = filePath.replace(/\.md$/, '');
            filePath = `${basePath}.${currentLang}.md`;
        }

        // Clé pour le localStorage basée sur le fichier
        const storageKey = filePath ? `reveal-slide-${filePath}` : 'reveal-slide-default';

        // Créer le logo BIP-21 à droite (toujours présent)
        const logoBip21 = document.createElement('a');
        logoBip21.href = 'https://bip-21.fr/';
        logoBip21.target = '_blank';
        logoBip21.rel = 'noopener noreferrer';
        logoBip21.className = 'logo-bip-21-container';
        logoBip21.title = 'BIP-21 - Bitcoin Île-de-France Partenaires';
        document.body.appendChild(logoBip21);

        // Changer le logo selon la présentation
        if (filePath && filePath.includes('be-bop')) {
            document.querySelector('.reveal').classList.add('logo-be-bop');
            // Créer le lien pour le logo be-bop
            const logoContainer = document.createElement('a');
            logoContainer.href = 'https://be-bop.io/';
            logoContainer.target = '_blank';
            logoContainer.rel = 'noopener noreferrer';
            logoContainer.className = 'logo-be-bop-container';
            logoContainer.title = 'be-BOP';
            const logoImg = document.createElement('img');
            logoImg.src = 'themes/logo-be-bop.svg';
            logoImg.alt = 'be-BOP';
            logoContainer.appendChild(logoImg);
            document.body.appendChild(logoContainer);
        } else if (filePath && (filePath.includes('sparrow') || filePath.includes('multisig'))) {
            // Ajouter le logo Sparrow à gauche pour les présentations Sparrow
            const logoContainer = document.createElement('a');
            logoContainer.href = 'https://www.sparrowwallet.com/';
            logoContainer.target = '_blank';
            logoContainer.rel = 'noopener noreferrer';
            logoContainer.className = 'logo-sparrow-container';
            logoContainer.title = 'Sparrow Wallet';
            document.body.appendChild(logoContainer);
        }

        // Gestion du mode plein écran
        const fullscreenButton = document.getElementById('fullscreen-button');

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error('Erreur lors de l\'activation du mode plein écran:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function updateFullscreenButton() {
            const icon = document.getElementById('fullscreen-icon');
            if (document.fullscreenElement) {
                icon.className = 'fa-solid fa-compress';
            } else {
                icon.className = 'fa-solid fa-expand';
            }
        }

        fullscreenButton.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', updateFullscreenButton);

        // Bouton pour aller à la première slide
        const firstSlideButton = document.getElementById('first-slide-button');
        function goToFirstSlide() {
            if (typeof Reveal !== 'undefined' && Reveal.isReady()) {
                Reveal.slide(0);
            }
        }
        firstSlideButton.addEventListener('click', goToFirstSlide);

        if (!filePath) {
            document.getElementById('slides-container').innerHTML = `
                <section>
                    <h1>Erreur</h1>
                    <p>Aucun fichier de présentation spécifié.</p>
                    <p><a href="index.html">Retour à l'accueil</a></p>
                </section>
            `;
            Reveal.initialize({
                hash: true,
                controls: true,
                progress: true,
                center: true,
                touch: true,
                loop: false,
                transition: 'slide'
            }).then(() => {
                // Fonction pour mettre à jour le numéro de slide
                function updateSlideNumber() {
                    const currentSlide = Reveal.getIndices();
                    const totalSlides = Reveal.getTotalSlides();
                    const slideNumber = currentSlide.h + 1;
                    document.getElementById('slide-number').textContent = `${slideNumber} / ${totalSlides}`;

                    // Sauvegarder l'index dans localStorage
                    localStorage.setItem(storageKey, currentSlide.h.toString());
                }

                // Restaurer la position sauvegardée
                const savedSlideIndex = localStorage.getItem(storageKey);
                const slideToLoad = savedSlideIndex ? parseInt(savedSlideIndex, 10) : 0;

                updateSlideNumber();
                Reveal.on('slidechanged', updateSlideNumber);

                // Aller à la slide sauvegardée ou à la première
                Reveal.slide(slideToLoad);
            });
        } else {
            // Charger le fichier markdown d'abord avec fallback vers français
            function loadMarkdownFile(path) {
                return fetch(path)
                    .then(response => {
                        if (response.ok) {
                            return response.text();
                        }
                        throw new Error('File not found');
                    });
            }

            // Try to load the file with current language, fallback to French if not found
            loadMarkdownFile(filePath)
                .catch(() => {
                    // Fallback to French if current language file doesn't exist
                    const basePath = filePath.replace(/\.(fr|en|es|it|de)\.md$/, '');
                    const fallbackPath = `${basePath}.fr.md`;
                    if (fallbackPath !== filePath) {
                        filePath = fallbackPath;
                        return loadMarkdownFile(fallbackPath);
                    }
                    throw new Error('Fichier non trouvé');
                })
                .then(markdown => {
                    if (!markdown) {
                        throw new Error('Fichier vide');
                    }
                    return markdown;
                })
                .then(markdown => {
                    // Extraire le titre de la présentation (premier H1)
                    const titleMatch = markdown.match(/^#\s+(.+)$/m);
                    const presentationTitle = titleMatch ? titleMatch[1] : '';

                    // Afficher le titre en haut des slides
                    if (presentationTitle) {
                        const titleElement = document.createElement('div');
                        titleElement.className = 'presentation-title';
                        titleElement.textContent = presentationTitle;
                        document.body.appendChild(titleElement);
                    }

                    // Convertir le markdown en slides Reveal.js
                    // Les séparateurs de slides sont --- ou ***
                    const slides = markdown.split(/\n---\n|\n\*\*\*\n/);
                    const slidesHTML = slides.map(slide => {
                        const trimmed = slide.trim();
                        if (!trimmed) return '';
                        // Convertir le markdown en HTML avec marked.js
                        const html = marked.parse(trimmed);
                        return `<section>${html}</section>`;
                    }).filter(s => s).join('\n');

                    document.getElementById('slides-container').innerHTML = slidesHTML;

                    // Initialiser Reveal.js après avoir chargé le contenu
                    Reveal.initialize({
                        hash: true,
                        controls: true,
                        progress: true,
                        center: true,
                        touch: true,
                        loop: false,
                        transition: 'slide',
                        plugins: [RevealNotes, RevealHighlight]
                    }).then(() => {
                        // Activer la coloration syntaxique
                        if (typeof hljs !== 'undefined') {
                            document.querySelectorAll('pre code').forEach((block) => {
                                hljs.highlightElement(block);
                            });
                        }

                        // Fonction pour mettre à jour le numéro de slide
                        function updateSlideNumber() {
                            const currentSlide = Reveal.getIndices();
                            const totalSlides = Reveal.getTotalSlides();
                            const slideNumber = currentSlide.h + 1; // h est l'index horizontal (slide principale)
                            document.getElementById('slide-number').textContent = `${slideNumber} / ${totalSlides}`;

                            // Sauvegarder l'index dans localStorage
                            localStorage.setItem(storageKey, currentSlide.h.toString());
                        }

                        // Restaurer la position sauvegardée
                        const savedSlideIndex = localStorage.getItem(storageKey);
                        const slideToLoad = savedSlideIndex ? parseInt(savedSlideIndex, 10) : 0;

                        // Mettre à jour au chargement
                        updateSlideNumber();

                        // Mettre à jour lors du changement de slide
                        Reveal.on('slidechanged', updateSlideNumber);

                        // Aller à la slide sauvegardée ou à la première
                        Reveal.slide(slideToLoad);
                    });
                })
                .catch(error => {
                    document.getElementById('slides-container').innerHTML = `
                        <section>
                            <h1>Erreur</h1>
                            <p>Impossible de charger le fichier: ${filePath}</p>
                            <p>${error.message}</p>
                            <p><a href="index.html">Retour à l'accueil</a></p>
                        </section>
                    `;
                    Reveal.initialize({
                        hash: true,
                        controls: true,
                        progress: true,
                        center: true,
                        touch: true,
                        loop: false,
                        transition: 'slide'
                    });
                });
        }
    </script>
</body>
